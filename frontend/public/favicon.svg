<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  <!-- Portfolio briefcase icon -->
  <g transform="translate(50, 50)">
    <!-- Briefcase body -->
    <rect x="-22" y="-10" width="44" height="28" rx="2" fill="white" opacity="0.95"/>
    <!-- Briefcase handle -->
    <path d="M -18,-10 Q -18,-22 0,-25 Q 18,-22 18,-10" fill="none" stroke="white" stroke-width="2.5" opacity="0.95"/>
    <!-- Briefcase latch -->
    <circle cx="0" cy="-3" r="2.5" fill="white" opacity="0.95"/>
  </g>
</svg>